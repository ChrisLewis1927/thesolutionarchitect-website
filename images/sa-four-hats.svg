<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="t d">
<title id="t">The four hats a Solution Architect wears</title>
<desc id="d">Four cards describe the Solution Architect responsibilities: translator, decision maker, risk manager and quality guardian.</desc>

<style>
  :root{
    --ink:#0B2A4A;
    --ink-muted:#52657A;
    --accent:#155E96;
    --accent-2:#EAF5FC;
    --card:#FBFCFE;
    --card-border:#B9C9D8;
    --soft:#DDECF6;
    --line:#0B2A4A;
    --shadow:rgba(11,42,74,.10);
  }
  svg{background:#ffffff}
  text{
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    fill:var(--ink);
  }
  .title{font-size:44px;font-weight:760;letter-spacing:-1.2px}
  .subtitle{font-size:30px;font-weight:420;fill:var(--ink-muted)}
  .chip-title{font-size:32px;font-weight:720}
  .chip-text{font-size:28px;font-weight:640}
  .small{font-size:28px;font-weight:440;fill:var(--ink-muted)}
  .card{fill:var(--card);stroke:var(--card-border);stroke-width:2.5}
  .accent-card{fill:var(--accent-2);stroke:var(--accent);stroke-width:3}
  .icon-bg{fill:var(--soft)}
  .icon-line{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .icon-fill{fill:var(--ink)}
  .connector{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .arrow-head{fill:var(--line)}
  .caption{font-size:31px;font-weight:640}
  .shadow{filter:url(#softShadow)}
</style>
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A4A" flood-opacity=".08"/>
  </filter>
</defs>

<rect width="1536" height="1024" fill="#fff"/>

<rect class="card shadow" x="168" y="130" width="572" height="370" rx="24"/>
<circle class="icon-bg" cx="454" cy="248" r="80"/>

    <g transform="translate(454 248) scale(0.72)" class="icon-line">
      <circle cx="-45" cy="-12" r="13"/>
      <circle cx="45" cy="-12" r="13"/>
      <path d="M-68 45v-20c0-17 10-28 25-28"/>
      <path d="M68 45v-20c0-17-10-28-25-28"/>
      <path d="M-22 10h44"/>
      <path d="M-12 0l-10 10 10 10"/>
      <path d="M12 0l10 10-10 10"/>
      <path d="M-36 -44c20-22 52-22 72 0"/>
      <path d="M-26 -50l-10 6 6 10"/>
    </g>
<text class="title" x="454" y="389" text-anchor="middle">Translator</text>
<text class="subtitle" x="454" y="444" text-anchor="middle">moves between worlds</text>

<rect class="card shadow" x="792" y="130" width="572" height="370" rx="24"/>
<circle class="icon-bg" cx="1078" cy="248" r="80"/>

    <g transform="translate(1078 248) scale(0.74)" class="icon-line">
      <path d="M0 -58v116"/>
      <path d="M0 -42h54l18 18-18 18H0z"/>
      <path d="M0 2h-54l-18 18 18 18H0z"/>
      <path d="M-22 58h44"/>
    </g>
<text class="title" x="1078" y="389" text-anchor="middle">Decision maker</text>
<text class="subtitle" x="1078" y="444" text-anchor="middle">chooses and sets constraints</text>

<rect class="card shadow" x="168" y="540" width="572" height="360" rx="24"/>
<circle class="icon-bg" cx="454" cy="658" r="80"/>

    <g transform="translate(454 658) scale(0.7)" class="icon-line">
      <circle cx="-12" cy="-10" r="46"/>
      <path d="M22 24l42 42"/>
      <path d="M-48 20h18v-32h18v32h18v-54h18v54h18v-72h18"/>
    </g>
<text class="title" x="454" y="794" text-anchor="middle">Risk manager</text>
<text class="subtitle" x="454" y="848" text-anchor="middle">names and sizes the risks</text>

<rect class="card shadow" x="792" y="540" width="572" height="360" rx="24"/>
<circle class="icon-bg" cx="1078" cy="658" r="80"/>

    <g transform="translate(1078 658) scale(0.7)" class="icon-line">
      <path d="M0 -60l56 22v42c0 43-29 71-56 84-27-13-56-41-56-84v-42z"/>
      <path d="M-25 8l18 18 36-42"/>
    </g>
<text class="title" x="1078" y="794" text-anchor="middle">Quality guardian</text>
<text class="subtitle" x="1078" y="848" text-anchor="middle">holds the line on quality</text>
</svg>
