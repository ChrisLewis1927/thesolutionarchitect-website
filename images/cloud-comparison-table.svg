  <rect x="0" y="462" width="1200" height="28" fill="#f4f6fa"/>
  <text x="40" y="481" font-size="10" font-weight="700" fill="#8593a8" letter-spacing="2.5">DATA</text>

  <!-- Row: Managed SQL (y=490) -->
  <text x="40" y="514" font-size="14" font-weight="500" fill="#0b1d3a">Managed relational DB</text>
  <text x="320" y="514" font-size="14" fill="#3a4a63">RDS / Aurora</text>
  <text x="620" y="514" font-size="14" fill="#3a4a63">Azure SQL Database</text>
  <text x="920" y="514" font-size="14" fill="#3a4a63">Cloud SQL / Spanner</text>

  <!-- Row: Managed NoSQL (y=526) -->
  <rect x="0" y="526" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="550" font-size="14" font-weight="500" fill="#0b1d3a">Managed NoSQL</text>
  <text x="320" y="550" font-size="14" fill="#3a4a63">DynamoDB</text>
  <text x="620" y="550" font-size="14" fill="#3a4a63">Cosmos DB</text>
  <text x="920" y="550" font-size="14" fill="#3a4a63">Firestore / Bigtable</text>

  <!-- Row: Data warehouse (y=562) -->
  <text x="40" y="586" font-size="14" font-weight="500" fill="#0b1d3a">Data warehouse</text>
  <text x="320" y="586" font-size="14" fill="#3a4a63">Redshift</text>
  <text x="620" y="586" font-size="14" fill="#3a4a63">Synapse Analytics</text>
  <text x="920" y="586" font-size="14" fill="#3a4a63">BigQuery</text>

