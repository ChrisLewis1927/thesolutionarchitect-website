  <rect x="0" y="326" width="1200" height="28" fill="#f4f6fa"/>
  <text x="40" y="345" font-size="10" font-weight="700" fill="#8593a8" letter-spacing="2.5">STORAGE</text>

  <!-- Row: Object storage (y=354) -->
  <text x="40" y="378" font-size="14" font-weight="500" fill="#0b1d3a">Object storage</text>
  <text x="320" y="378" font-size="14" fill="#3a4a63">S3</text>
  <text x="620" y="378" font-size="14" fill="#3a4a63">Blob Storage</text>
  <text x="920" y="378" font-size="14" fill="#3a4a63">Cloud Storage</text>

  <!-- Row: Block storage (y=390) -->
  <rect x="0" y="390" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="414" font-size="14" font-weight="500" fill="#0b1d3a">Block storage</text>
  <text x="320" y="414" font-size="14" fill="#3a4a63">EBS</text>
  <text x="620" y="414" font-size="14" fill="#3a4a63">Managed Disks</text>
  <text x="920" y="414" font-size="14" fill="#3a4a63">Persistent Disk</text>

  <!-- Row: File storage (y=426) -->
  <text x="40" y="450" font-size="14" font-weight="500" fill="#0b1d3a">Shared file storage</text>
  <text x="320" y="450" font-size="14" fill="#3a4a63">EFS</text>
  <text x="620" y="450" font-size="14" fill="#3a4a63">Azure Files</text>
  <text x="920" y="450" font-size="14" fill="#3a4a63">Filestore</text>

