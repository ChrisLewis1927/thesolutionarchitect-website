<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="920" fill="#ffffff"/>

  <!-- Title block -->
  <text x="60" y="48" font-size="26" font-weight="700" fill="#0b1d3a">Cloud services at a glance</text>
  <text x="60" y="74" font-size="14" fill="#5a6b85">A Solution Architect's translation table for AWS, Azure, and GCP</text>

  <!-- Column header bar -->
  <rect x="0" y="100" width="1200" height="54" fill="#f4f6fa"/>
  <text x="40" y="133" font-size="11" font-weight="700" fill="#5a6b85" letter-spacing="2">CATEGORY</text>

  <!-- AWS header -->
  <rect x="300" y="100" width="6" height="54" fill="#FF9900"/>
  <text x="320" y="133" font-size="15" font-weight="700" fill="#0b1d3a">AWS</text>

  <!-- Azure header -->
  <rect x="600" y="100" width="6" height="54" fill="#0078D4"/>
  <text x="620" y="133" font-size="15" font-weight="700" fill="#0b1d3a">Microsoft Azure</text>

  <!-- GCP header -->
  <rect x="900" y="100" width="6" height="54" fill="#34A853"/>
  <text x="920" y="133" font-size="15" font-weight="700" fill="#0b1d3a">Google Cloud</text>

  <!-- ============ COMPUTE SECTION ============ -->
  <rect x="0" y="154" width="1200" height="28" fill="#fafbfd"/>
  <text x="40" y="173" font-size="10" font-weight="700" fill="#8593a8" letter-spacing="2.5">COMPUTE</text>

  <!-- Row: VMs (y=182) -->
  <text x="40" y="206" font-size="14" font-weight="500" fill="#0b1d3a">Virtual machines</text>
  <text x="320" y="206" font-size="14" fill="#3a4a63">EC2</text>
  <text x="620" y="206" font-size="14" fill="#3a4a63">Virtual Machines</text>
  <text x="920" y="206" font-size="14" fill="#3a4a63">Compute Engine</text>

  <!-- Row: Serverless (y=218) -->
  <rect x="0" y="218" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="242" font-size="14" font-weight="500" fill="#0b1d3a">Serverless functions</text>
  <text x="320" y="242" font-size="14" fill="#3a4a63">Lambda</text>
  <text x="620" y="242" font-size="14" fill="#3a4a63">Azure Functions</text>
  <text x="920" y="242" font-size="14" fill="#3a4a63">Cloud Functions</text>

  <!-- Row: Containers (y=254) -->
  <text x="40" y="278" font-size="14" font-weight="500" fill="#0b1d3a">Managed containers</text>
  <text x="320" y="278" font-size="14" fill="#3a4a63">ECS / Fargate</text>
  <text x="620" y="278" font-size="14" fill="#3a4a63">Container Apps</text>
  <text x="920" y="278" font-size="14" fill="#3a4a63">Cloud Run</text>

  <!-- Row: Kubernetes (y=290) -->
  <rect x="0" y="290" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="314" font-size="14" font-weight="500" fill="#0b1d3a">Kubernetes</text>
  <text x="320" y="314" font-size="14" fill="#3a4a63">EKS</text>
  <text x="620" y="314" font-size="14" fill="#3a4a63">AKS</text>
  <text x="920" y="314" font-size="14" fill="#3a4a63">GKE</text>

