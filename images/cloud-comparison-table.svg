  <!-- Row: Identity (y=762) -->
  <text x="40" y="786" font-size="14" font-weight="500" fill="#0b1d3a">Identity &amp; access</text>
  <text x="320" y="786" font-size="14" fill="#3a4a63">IAM</text>
  <text x="620" y="786" font-size="14" fill="#3a4a63">Entra ID</text>
  <text x="920" y="786" font-size="14" fill="#3a4a63">Cloud IAM</text>

  <!-- Row: Key management (y=798) -->
  <rect x="0" y="798" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="822" font-size="14" font-weight="500" fill="#0b1d3a">Key management</text>
  <text x="320" y="822" font-size="14" fill="#3a4a63">KMS</text>
  <text x="620" y="822" font-size="14" fill="#3a4a63">Key Vault</text>
  <text x="920" y="822" font-size="14" fill="#3a4a63">Cloud KMS</text>

  <!-- Row: WAF (y=834) -->
  <text x="40" y="858" font-size="14" font-weight="500" fill="#0b1d3a">Web app firewall</text>
  <text x="320" y="858" font-size="14" fill="#3a4a63">AWS WAF</text>
  <text x="620" y="858" font-size="14" fill="#3a4a63">App Gateway WAF</text>
  <text x="920" y="858" font-size="14" fill="#3a4a63">Cloud Armor</text>

  <!-- Row: Threat detection (y=870) -->
  <rect x="0" y="870" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="894" font-size="14" font-weight="500" fill="#0b1d3a">Threat detection</text>
  <text x="320" y="894" font-size="14" fill="#3a4a63">GuardDuty</text>
  <text x="620" y="894" font-size="14" fill="#3a4a63">Defender for Cloud</text>
  <text x="920" y="894" font-size="14" fill="#3a4a63">Security Command Center</text>

  <!-- Bottom border -->
  <line x1="0" y1="906" x2="1200" y2="906" stroke="#e5e9f0" stroke-width="1"/>
</svg>
