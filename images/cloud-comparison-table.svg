  <text x="40" y="617" font-size="10" font-weight="700" fill="#8593a8" letter-spacing="2.5">NETWORKING</text>

  <!-- Row: Virtual network (y=626) -->
  <text x="40" y="650" font-size="14" font-weight="500" fill="#0b1d3a">Virtual network</text>
  <text x="320" y="650" font-size="14" fill="#3a4a63">VPC</text>
  <text x="620" y="650" font-size="14" fill="#3a4a63">VNet</text>
  <text x="920" y="650" font-size="14" fill="#3a4a63">VPC (global)</text>

  <!-- Row: CDN (y=662) -->
  <rect x="0" y="662" width="1200" height="36" fill="#fafbfd"/>
  <text x="40" y="686" font-size="14" font-weight="500" fill="#0b1d3a">Content delivery</text>
  <text x="320" y="686" font-size="14" fill="#3a4a63">CloudFront</text>
  <text x="620" y="686" font-size="14" fill="#3a4a63">Front Door</text>
  <text x="920" y="686" font-size="14" fill="#3a4a63">Cloud CDN</text>

  <!-- Row: DNS (y=698) -->
  <text x="40" y="722" font-size="14" font-weight="500" fill="#0b1d3a">DNS</text>
  <text x="320" y="722" font-size="14" fill="#3a4a63">Route 53</text>
  <text x="620" y="722" font-size="14" fill="#3a4a63">Azure DNS</text>
  <text x="920" y="722" font-size="14" fill="#3a4a63">Cloud DNS</text>

  <!-- ============ SECURITY SECTION ============ -->
