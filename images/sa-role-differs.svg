<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="t d">
<title id="t">Where the Solution Architect sits</title>
<desc id="d">The Solution Architect sits at the centre, integrating enterprise, technical, business and data architecture perspectives.</desc>

<style>
  :root{
    --ink:#0B2A4A;
    --ink-muted:#52657A;
    --accent:#155E96;
    --accent-2:#EAF5FC;
    --card:#FBFCFE;
    --card-border:#B9C9D8;
    --soft:#DDECF6;
    --line:#0B2A4A;
    --shadow:rgba(11,42,74,.10);
  }
  svg{background:#ffffff}
  text{
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    fill:var(--ink);
  }
  .title{font-size:44px;font-weight:760;letter-spacing:-1.2px}
  .subtitle{font-size:30px;font-weight:420;fill:var(--ink-muted)}
  .chip-title{font-size:32px;font-weight:720}
  .chip-text{font-size:28px;font-weight:640}
  .small{font-size:28px;font-weight:440;fill:var(--ink-muted)}
  .card{fill:var(--card);stroke:var(--card-border);stroke-width:2.5}
  .accent-card{fill:var(--accent-2);stroke:var(--accent);stroke-width:3}
  .icon-bg{fill:var(--soft)}
  .icon-line{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .icon-fill{fill:var(--ink)}
  .connector{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .arrow-head{fill:var(--line)}
  .caption{font-size:31px;font-weight:640}
  .shadow{filter:url(#softShadow)}
</style>
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A4A" flood-opacity=".08"/>
  </filter>
</defs>

<rect width="1536" height="1024" fill="#fff"/>

<!-- Outer cards -->
<rect class="card shadow" x="80" y="164" width="416" height="292" rx="22"/>

    <g transform="translate(288 265) scale(0.92)" class="icon-line">
      <path d="M-58 -20L0 -55l58 35z"/>
      <path d="M-48 -20h96"/>
      <path d="M-44 45h88"/>
      <path d="M-56 62h112"/>
      <path d="M-36 -16v58M-12 -16v58M12 -16v58M36 -16v58"/>
    </g>
<text class="chip-title" x="288" y="366" text-anchor="middle">Enterprise architect</text>
<text class="small" x="288" y="418" text-anchor="middle">strategy and standards</text>

<rect class="card shadow" x="80" y="540" width="416" height="288" rx="22"/>

    <g transform="translate(288 641) scale(0.82)" class="icon-line">
      <circle cx="-28" cy="-28" r="13"/>
      <circle cx="0" cy="-38" r="16"/>
      <circle cx="28" cy="-28" r="13"/>
      <path d="M-50 28v-15c0-18 12-30 30-30"/>
      <path d="M-25 30v-18c0-22 15-36 25-36s25 14 25 36v18"/>
      <path d="M50 28v-15c0-18-12-30-30-30"/>
    </g>
<text class="chip-title" x="288" y="736" text-anchor="middle">Business architect</text>
<text class="small" x="288" y="786" text-anchor="middle">capabilities, processes</text>

<rect class="card shadow" x="1040" y="164" width="416" height="292" rx="22"/>

    <g transform="translate(1248 263) scale(0.72)" class="icon-line">
      <rect x="-64" y="-48" width="128" height="84" rx="8"/>
      <path d="M-64 18h128"/>
      <path d="M-18 -25l-22 22 22 22"/>
      <path d="M18 -25l22 22-22 22"/>
      <path d="M-2 24v30"/>
      <path d="M-30 56h60"/>
    </g>
<text class="chip-title" x="1248" y="366" text-anchor="middle">Technical architect</text>
<text class="small" x="1248" y="418" text-anchor="middle">frameworks and code</text>

<rect class="card shadow" x="1040" y="540" width="416" height="288" rx="22"/>

    <g transform="translate(1248 641) scale(0.72)" class="icon-line">
      <ellipse cx="-12" cy="-38" rx="48" ry="18"/>
      <path d="M-60 -38v80c0 10 22 18 48 18s48-8 48-18v-80"/>
      <path d="M-60 -2c0 10 22 18 48 18s48-8 48-18"/>
      <path d="M-60 35c0 10 22 18 48 18s48-8 48-18"/>
      <path d="M40 26l20 8v28c0 20-13 34-20 38-7-4-20-18-20-38V34z"/>
      <path d="M30 58l8 8 16-18"/>
    </g>
<text class="chip-title" x="1248" y="736" text-anchor="middle">Data architect</text>
<text class="small" x="1248" y="786" text-anchor="middle">models and governance</text>

<!-- Connectors behind centre -->
<path class="connector" d="M496 292 H520 L580 360"/>
<path class="connector" d="M496 684 H520 L580 616"/>
<path class="connector" d="M1040 292 H1016 L956 360"/>
<path class="connector" d="M1040 684 H1016 L956 616"/>

<!-- Centre card -->
<rect class="accent-card shadow" x="578" y="336" width="380" height="304" rx="22"/>

    <g transform="translate(768 443) scale(0.76)" class="icon-line">
      <path d="M-88 28h176"/>
      <path d="M-70 28v-70M70 28v-70"/>
      <path d="M-100 -10 C-58 -20 -35 -48 0 -48 C35 -48 58 -20 100 -10"/>
      <path d="M-82 -8v36M-55 -17v45M-28 -35v63M28 -35v63M55 -17v45M82 -8v36"/>
      <path d="M-105 50 C-80 40 -60 60 -35 50 S10 60 35 50 S80 60 105 50"/>
    </g>
<text class="title" x="768" y="545" text-anchor="middle">Solution architect</text>
<text class="subtitle" x="768" y="598" text-anchor="middle" fill="#155E96">the integrator</text>
</svg>
